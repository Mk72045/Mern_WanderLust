name: Deploy WanderLust

on:
  push:
    branches:
      - main

jobs:
  # BUILD AND PUSH DOCKER IMAGES

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend image
        run: |
          docker build \
            -t mk180/mern-wanderlust-backend:latest \
            ./Backend

      - name: Build Frontend image
        run: |
          docker build \  
            --build-arg VITE_API_URL=/api \
            -t mk180/mern-wanderlust-frontend:latest \
            ./Frontend

      - name: Push backend image
        run: |
          docker push mk180/mern-wanderlust-backend:latest

      - name: Push frontend image
        run: |
          docker push mk180/mern-wanderlust-frontend:latest

  # DEPLOY IMAGES TO EC2

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy latest Docker images
        run: |
          set -e

          echo "🚀 Starting Docker deployment..."

          APP_DIR="/home/ubuntu/Mern_WanderLust"
          cd "$APP_DIR"

          echo "📥 Pulling latest backend and frontend images..."

          if [ ! -f "./Backend/.env" ]; then
            echo "❌ Missing $APP_DIR/Backend/.env on the server."
            echo "   Create it manually on EC2 (same as your local Backend/.env). It is not stored in Git."
            exit 1
          fi

          # Old PM2/nginx setup often keeps port 80 busy — Docker frontend needs it
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nginx; then
            echo "⚠️ Stopping system nginx so the frontend container can use port 80..."
            sudo systemctl stop nginx
          fi

          echo "📥 Pulling latest images from Docker Hub..."
          docker compose -f docker.yml pull

          echo "🔄 Starting / recreating all containers..."
          docker compose -f docker.yml up -d --force-recreate --remove-orphans

          echo "🔍 Container status:"
          docker compose -f docker.yml ps

          echo "🌐 Checking frontend on port 80..."
          sleep 3
          curl -fsS http://127.0.0.1/ >/dev/null

          echo "🧹 Cleaning unused Docker images..."
          docker image prune -f

          echo "✅ Deployment completed successfully!"
